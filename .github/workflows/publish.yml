name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships an older npm.
    - name: Upgrade npm for OIDC trusted publishing
      run: npm install -g npm@latest

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    # No NODE_AUTH_TOKEN: this package uses npm Trusted Publishing (OIDC).
    # The id-token: write permission above lets npm mint a short-lived
    # credential from GitHub's OIDC provider, and provenance is generated
    # automatically. See npmjs.com -> package -> Settings -> Trusted Publisher.
    - name: Publish to npm
      run: npm publish --provenance --access public
